<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="INVERMAX LATAM">
  <defs>
    <linearGradient id="bg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="22%" stop-color="#3f3f46"/>
      <stop offset="55%" stop-color="#27272a"/>
      <stop offset="82%" stop-color="#4a4035"/>
      <stop offset="100%" stop-color="#6b5d45"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#bg)" stroke="#fbbf24" stroke-width="1.2" filter="url(#glow)"/>
  <text x="16" y="21.5" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">I</text>
</svg>
