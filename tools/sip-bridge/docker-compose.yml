# FreeSWITCH como gateway WebRTC ↔ SIP/UDP
# Requiere VPS con network_mode host (Linux) para RTP.
# Ver README.md para variables Render (SIP_WSS_URL).

services:
  freeswitch:
    image: safarov/freeswitch:latest
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./freeswitch/autoload_configs/event_socket.conf.xml:/etc/freeswitch/autoload_configs/event_socket.conf.xml:ro
      - ./freeswitch/sip_profiles/internal.xml:/etc/freeswitch/sip_profiles/internal.xml:ro
      - ./freeswitch/sip_profiles/external.xml:/etc/freeswitch/sip_profiles/external.xml:ro
      - ./freeswitch/directory/default.xml:/etc/freeswitch/directory/default.xml:ro
      - ./freeswitch/dialplan/default.xml:/etc/freeswitch/dialplan/default.xml:ro
      - ./freeswitch/tls:/etc/freeswitch/tls
